# Configuration pour déploiement sur Render.com
services:
  # Service Web pour le backend Spring Boot
  - type: web
    name: explorateurs-backend
    runtime: docker
    region: frankfurt # ou oregon, singapore selon votre localisation
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx512m"

  # Service Web pour la consultation seule (sans auth) via backend_beta
  - type: web
    name: explorateurs-backend-beta
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./backend_beta/Dockerfile
    dockerContext: ./backend_beta
    envVars:
      - key: PORT
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx512m"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  # Frontend React/Vite
  - type: web
    name: explorateurs-frontend
    runtime: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://explorateurs-backend.onrender.com
      - key: VITE_BETA_API_URL
        value: https://explorateurs-backend-beta.onrender.com
      - key: VITE_API_TIMEOUT
        value: "30000"

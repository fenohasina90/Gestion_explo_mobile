spring.application.name=backend

# Configuration SQLite
spring.datasource.url=jdbc:sqlite:explorateurs.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Configuration JPA/Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.explorateur.backend.service=DEBUG

# Configuration du serveur
server.port=8080

# Configuration Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.packages-to-scan=com.explorateur.backend.controller

# Configuration JWT
jwt.secret=maCleSecreteTresLonguePourLeJWTDeLApplicationExplorateurClubScoutAventiste2026
jwt.expiration=86400000

# Configuration pour Production
spring.application.name=backend

# Configuration PostgreSQL (Supabase)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/explorateurs}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Configuration JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Pool de connexions HikariCP (optimisation production)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# Configuration du serveur - Port dynamique pour déploiement cloud
server.port=${PORT:8080}

# Configuration Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.packages-to-scan=com.explorateur.backend.controller

# Configuration JWT
jwt.secret=${JWT_SECRET:maCleSecreteTresLonguePourLeJWTDeLApplicationExplorateurClubScoutAventiste2026}
jwt.expiration=86400000

# Logs en production
logging.level.root=INFO
logging.level.com.explorateur.backend=INFO
logging.level.org.hibernate.SQL=WARN

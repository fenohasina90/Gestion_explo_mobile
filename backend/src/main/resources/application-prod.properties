# Configuration pour Production
spring.application.name=backend

# Configuration SQLite - Base stockée dans /data pour persistance
spring.datasource.url=jdbc:sqlite:/data/explorateurs.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Configuration JPA/Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configuration du serveur - Port dynamique pour déploiement cloud
server.port=${PORT:8080}

# Configuration Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.packages-to-scan=com.explorateur.backend.controller

# Configuration JWT
jwt.secret=${JWT_SECRET:maCleSecreteTresLonguePourLeJWTDeLApplicationExplorateurClubScoutAventiste2026}
jwt.expiration=86400000

# Logs en production
logging.level.root=INFO
logging.level.com.explorateur.backend=INFO
logging.level.org.hibernate.SQL=WARN

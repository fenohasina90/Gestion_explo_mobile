# Configuration pour Production
spring.application.name=backend

# Configuration PostgreSQL (Supabase)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuration JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Pool de connexions HikariCP (optimisé pour Render Free + Supabase)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.leak-detection-threshold=60000
# Compatibilite Supabase pooler (PgBouncer): evite les collisions de prepared statements
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preferQueryMode=simple

# Configuration du serveur - Port dynamique pour déploiement cloud
server.port=${PORT:8080}

# Compression HTTP (réduit la bande passante)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# Configuration Swagger/OpenAPI - DÉSACTIVÉ en production pour économiser mémoire
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Configuration JWT
jwt.secret=${JWT_SECRET:maCleSecreteTresLonguePourLeJWTDeLApplicationExplorateurClubScoutAventiste2026}
jwt.expiration=86400000

# Logs en production - Minimisés pour performance
logging.level.root=WARN
logging.level.com.explorateur.backend=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.web=WARN

# Optimisations JPA/Hibernate pour performance
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Désactiver devtools en production
spring.devtools.restart.enabled=false

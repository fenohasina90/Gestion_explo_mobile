name: Keep Backend Alive

on:
  schedule:
    # Ping toutes les 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permet déclenchement manuel

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -f https://explorateurs-backend.onrender.com/actuator/health || echo "Ping échoué mais on continue"
          
      - name: Afficher résultat
        run: echo "✅ Ping effectué à $(date)"
